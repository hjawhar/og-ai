name: release

# Publishes @hjawhar/og-cli and its five platform packages when a version tag is
# pushed. One job is enough: `bun build --compile` cross-compiles every target
# from a single Linux runner, so there is no build matrix to fan out and no
# artefact shuffling between jobs.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "publish to npm (otherwise build and verify only)"
        type: boolean
        default: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # npm trusted publishing reads this; it is also what lets provenance be attached.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # The launcher runs on Node, and `npm publish` is Node's tool; the CLI
      # itself never touches this runtime.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - run: bun install --frozen-lockfile

      - name: Typecheck and test
        run: |
          bun x tsc --noEmit
          bun test

      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(bun --print 'require("./package.json").version')"
          [ "$tag" = "$pkg" ] || { echo "tag $tag != package.json $pkg"; exit 1; }

      - name: Build and verify the packages
        run: bun run tools/release.ts

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
        run: bun run tools/release.ts --publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
